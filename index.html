<!DOCTYPE html>
<html lang="en" class="no-js">

<head>
	<meta charset="UTF-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
	<link rel="stylesheet" type="text/css" href="css/demo.css" />
	<title>My Portfolio</title>
	<link rel="stylesheet" href="./css/style2.css" />
	<link rel="stylesheet" href="./css/mediaqueries.css" />
	<script>document.documentElement.className = 'js';</script>

	<style>
		body {
			font-family: 'Playfair Display', serif;
		}

		/* ===== BACKGROUND ===== */
		.background {
			width: 100%;
			height: 100vh;
			background-image: url('./assets/bg-image.png');
			background-size: cover;
			background-repeat: no-repeat;
			background-position: center center;
		}

		/* ===== MINIMAL LOADER ===== */
		.loader {
			position: fixed;
			inset: 0;
			background: #f5f6fa;
			display: flex;
			flex-direction: column;
			align-items: center;
			justify-content: center;
			z-index: 9999;
			font-family: 'Inter', sans-serif;
			opacity: 0;
			animation: fadeInLoader 0.6s ease forwards;
		}

		.loader-logo {
			font-weight: 600;
			font-size: 3rem;
			color: #1e2a55;
			letter-spacing: 4px;
			transform: scale(0.5);
			opacity: 0;
			animation: popUp 1.2s ease forwards 0.3s;
		}

		.loader h2 {
			margin-top: 0.8rem;
			font-weight: 400;
			font-size: 1rem;
			color: #555;
			letter-spacing: 3px;
			opacity: 0;
			animation: fadeText 1.4s ease forwards 0.6s;
		}

		/* ===== ANIMATIONS ===== */
		@keyframes popUp {
			0% {
				opacity: 0;
				transform: scale(0.5);
			}

			80% {
				opacity: 1;
				transform: scale(1.05);
			}

			100% {
				opacity: 1;
				transform: scale(1);
			}
		}

		@keyframes fadeText {
			from {
				opacity: 0;
			}

			to {
				opacity: 1;
			}
		}

		@keyframes fadeInLoader {
			from {
				opacity: 0;
			}

			to {
				opacity: 1;
			}
		}

		@keyframes fadeOutLoader {
			from {
				opacity: 1;
			}

			to {
				opacity: 0;
				visibility: hidden;
			}
		}

		/* ===== INTRO TEXT ===== */
		.intro-desc {
			font-family: 'Poppins', sans-serif;
			font-size: 1rem;
			color: #333;
			line-height: 1.8;
			max-width: 600px;
			margin: 0 auto 2rem;
			padding: 0 1.5rem;
			text-align: center;
		}

		/* ===== CONNECT TEXT ===== */
		.connect-text {
			font-family: 'Poppins', sans-serif;
			font-size: 1rem;
			color: #1e2a55;
			margin-bottom: 0.8rem;
			text-align: center;
			letter-spacing: 0.4px;
			font-weight: 500;
		}

		/* ===== POST-LOAD ENTRANCE ANIMATIONS ===== */

		/* Start hidden: shifted down slightly and transparent */
		.page-enter {
			opacity: 0;
			transform: translateY(18px) scale(0.995);
			transition: opacity 650ms cubic-bezier(.22, .9, .46, 1), transform 650ms cubic-bezier(.22, .9, .46, 1);
		}

		/* When page loaded, elements with this class will fade/slide into place */
		.page-loaded .page-enter {
			opacity: 1;
			transform: translateY(0) scale(1);
		}

		/* Slight stagger helpers */
		.stagger-1 {
			transition-delay: 0.08s;
		}

		.stagger-2 {
			transition-delay: 0.16s;
		}

		.stagger-3 {
			transition-delay: 0.24s;
		}

		/* Subtle hero image reveal */
		.section__pic-container {
			opacity: 0;
			transform: scale(0.98) translateY(8px);
			transition: opacity 700ms ease, transform 700ms ease;
		}

		.page-loaded .section__pic-container {
			opacity: 1;
			transform: scale(1) translateY(0);
		}

		/* Make sure the main content isn't interactable until revealed */
		.page-loaded .loader-interactive-blocked {
			pointer-events: auto;
		}

		/* ===== HOVER ANIMATIONS & CURSOR FIX ===== */

		/* Prevent text from showing the text-selection I-beam cursor on hover for non-interactive text.
		   Use !important to override other styles that might set cursor on nested elements. */
		#profile,
		#profile *,
		.section__text,
		.section__text *,
		.intro-desc,
		.connect-text,
		.title,
		.section__text__p1,
		.section__text__p2 {
			cursor: default !important;
		}

		/* Keep interactive elements showing pointer */
		a.global-menu__item,
		.global-menu__item,
		#socials-container .icon {
			cursor: pointer !important;
		}

		/* Title hover — subtle lift + color */
		.title {
			display: inline-block;
			/* disable hover animation for title */
			transition: none !important;
		}

		.title:hover {
			/* no animation on hover */
			transform: none !important;
			letter-spacing: normal !important;
			text-shadow: none !important;
		}

		/* Small header and connect text hover */
		/* Disable hover animations for paragraph/header text */
		.section__text__p1,
		.section__text__p2,
		.connect-text {
			transition: none !important;
		}

		.section__text__p1:hover,
		.section__text__p2:hover,
		.connect-text:hover {
			transform: none !important;
			opacity: 1 !important;
		}

		/* Improved hover on socials icons: lift, scale, slight rotation and soft shadow */
		#socials-container .icon {
			transition: transform 220ms cubic-bezier(.22, .9, .46, 1), box-shadow 220ms ease, opacity 180ms ease;
			display: inline-block;
		}

		#socials-container .icon:hover {
			transform: translateY(-6px) scale(1.08) rotate(-6deg);
			box-shadow: 0 12px 30px rgba(33, 54, 106, 0.12);
			opacity: 0.98;
		}
	</style>
</head>

<body class="demo-3">
	<!-- ===== LOADER ===== -->
	<div class="loader">
		<div class="loader-logo">VD</div>
		<h2>Loading Portfolio...</h2>
	</div>

	<div class="background">
		<main class="main main--demo-3">
			<div class="content content--demo-3">

				<!-- ===== HAMBURGER ===== -->
				<div class="hamburger hamburger--demo-3 js-hover">
					<div class="hamburger__line hamburger__line--01">
						<div class="hamburger__line-in hamburger__line-in--01"></div>
					</div>
					<div class="hamburger__line hamburger__line--02">
						<div class="hamburger__line-in hamburger__line-in--02"></div>
					</div>
					<div class="hamburger__line hamburger__line--03">
						<div class="hamburger__line-in hamburger__line-in--03"></div>
					</div>
					<div class="hamburger__line hamburger__line--cross01">
						<div class="hamburger__line-in hamburger__line-in--cross01"></div>
					</div>
					<div class="hamburger__line hamburger__line--cross02">
						<div class="hamburger__line-in hamburger__line-in--cross02"></div>
					</div>
				</div>

				<br><br><br>

				<!-- ===== PROFILE SECTION ===== -->
				<section id="profile">
					<div class="section__pic-container page-enter stagger-1">
						<img src="./assets/ab.png" alt="Vedant Dhamale profile picture" />
					</div>
					<div class="section__text stagger-2" style="margin-top: 4rem;">
						<p class="section__text__p1">Hello, I'm</p>
						<h1 class="title">Vedant Dhamale</h1>
						<p class="section__text__p2" style="color: #1e2a55;">Artifical Intelligence & Data Science
							Engineer</p>

						<!-- <p class="intro-desc">
							I’m Vedant, an aspiring Artificial Intelligence and Data Science Engineer, focused on
							creating intelligent systems
							and impactful machine learning solutions. My passion lies in transforming complex data into
							meaningful insights
							and building models that make a difference.
						</p> -->

						<p class="connect-text stagger-3">Connect with me:</p>

						<div id="socials-container" class="page-enter stagger-3">
							<img src="./assets/linkedin.png" alt="My LinkedIn profile" class="icon"
								onclick="window.open('https://www.linkedin.com/in/vedant-dhamale-0ab58b286', '_blank')" />
							<img src="./assets/github.png" alt="My GitHub profile" class="icon"
								onclick="window.open('https://github.com/VedantDhamale', '_blank')" />
						</div>
					</div>
				</section>

				<!-- ===== MENU ===== -->
				<div class="global-menu">
					<div class="global-menu__wrap">
						<a class="global-menu__item global-menu__item--demo-3" href="./index.html">Home</a>
						<a class="global-menu__item global-menu__item--demo-3" href="about.html">About</a>
						<a class="global-menu__item global-menu__item--demo-3" href="#">Experience</a>
						<a class="global-menu__item global-menu__item--demo-3" href="./project.html">Projects</a>
					</div>
				</div>

				<svg class="shape-overlays" viewBox="0 0 100 100" preserveAspectRatio="none">
					<path class="shape-overlays__path"></path>
					<path class="shape-overlays__path"></path>
					<path class="shape-overlays__path"></path>
				</svg>
			</div>
		</main>
	</div>

	<!-- ===== JS FILES ===== -->
	<script src="js/demo.js"></script>
	<script src="js/easings.js"></script>
	<script src="js/demo3.js"></script>
	<script src="./js/script2.js"></script>

	<script>
		window.addEventListener("load", () => {
			const loader = document.querySelector(".loader");
			// fade out then remove loader, then mark page as loaded to trigger entrance animations
			setTimeout(() => {
				loader.style.animation = "fadeOutLoader 0.8s ease forwards";
			}, 1700);
			setTimeout(() => {
				loader.style.display = "none";
				// add class to body to start entrance animations
				document.body.classList.add('page-loaded');
				// ensure interactive elements are available after reveal
				document.body.classList.remove('loading');
			}, 2500);
		});
	</script>
</body>

</html>
