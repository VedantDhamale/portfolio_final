    <style>
        .background {
            width: 100%;
            height: 100vh;
            background-image: url('./assets/bg-image.png');
            background-size: cover;
            background-repeat: no-repeat;
            background-position: center center;
        }

        /* Decrease space between "Browse My Recent" and Project title */
        .section__text__p1 {
            font-size: 1.2rem;
            margin-bottom: 0.5rem;
            /* Reduced the bottom margin */
            text-align: center;
        }

        .title {
            font-size: 2.5rem;
            margin-top: 0.5rem;
            /* Reduced the top margin */
            text-align: center;
        }

        .experience-details-container {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 1rem;
            /* Reduced gap between project cards */
            padding: 1rem;
        }

        .details-container {
            width: 30%;
            margin: 0.5rem;
            /* Reduced margin */
            padding: 1rem;
            background-color: #f5f5f5;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
        }

        .project-img {
            max-width: 100%;
            height: auto;
        }

        /* Responsive adjustments */
        @media screen and (max-width: 768px) {
            .details-container {
                width: 90%;
                /* Make project containers full width on smaller screens */
            }
        }
    </style>
</head>
