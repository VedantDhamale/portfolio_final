<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>My Portfolio</title>

    <!-- Fonts -->
    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&family=Playfair+Display:wght@600&display=swap"
        rel="stylesheet">

    <!-- Stylesheets -->
    <link rel="stylesheet" type="text/css" href="css/demo1.css" />
    <link rel="stylesheet" href="./css/style2.css" />
    <link rel="stylesheet" href="./css/mediaqueries.css" />

    <style>
        body {
            margin: 0;
            font-family: 'Poppins', sans-serif;
            background-image: url('./assets/bg-image.png');
            background-size: cover;
            background-repeat: no-repeat;
            background-attachment: fixed;
            background-position: center center;
            color: #fff;
            overflow-x: hidden;
        }

        .section__text__p1 {
            font-size: 1.2rem;
            margin-bottom: 0.5rem;
            text-align: center;
            font-weight: 500;
            color: #dcdcdc;
            letter-spacing: 1px;
        }

        .title {
            font-family: 'Playfair Display', serif;
            font-size: 2.8rem;
            margin-top: 0.5rem;
            text-align: center;
            color: #fff;
            text-shadow: 0 2px 8px rgba(0, 0, 0, 0.4);
        }

        .projects-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 1.8rem;
            padding: 2rem 3rem;
            justify-items: center;
        }

        .details-container {
            width: 100%;
            padding: 1.5rem;
            background: rgba(35, 40, 55, 0.6);
            border-radius: 16px;
            backdrop-filter: blur(14px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.25);
            transition: transform 0.35s ease, box-shadow 0.35s ease, background 0.35s ease;
            opacity: 0;
            transform: translateY(40px);
        }

        .details-container.visible {
            opacity: 1;
            transform: translateY(0);
        }

        .details-container:hover {
            transform: translateY(-10px);
            background: rgba(45, 50, 70, 0.7);
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.4);
        }

        .project-img {
            max-width: 100%;
            height: auto;
            border-radius: 12px;
            transition: transform 0.4s ease;
        }

        .details-container:hover .project-img {
            transform: scale(1.03);
        }

        h2.project-title {
            font-size: 1.3rem;
            color: #f0f0f0;
            text-align: center;
            margin-top: 0.9rem;
            letter-spacing: 0.5px;
            text-shadow: 0 1px 5px rgba(0, 0, 0, 0.6);
        }

        .btn-container {
            display: flex;
            justify-content: center;
            margin-top: 0.7rem;
        }

        .btn {
            padding: 0.6rem 1.2rem;
            border: 1.5px solid rgba(255, 255, 255, 0.6);
            background: transparent;
            color: #eaeaea;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 400;
            letter-spacing: 0.5px;
            transition: all 0.3s ease;
        }

        .btn:hover {
            border-color: #00bcd4;
            color: #00bcd4;
            box-shadow: 0 0 10px rgba(0, 188, 212, 0.4);
        }

        @media screen and (max-width: 992px) {
            .projects-grid {
                grid-template-columns: repeat(2, 1fr);
                padding: 2rem;
            }
        }

        @media screen and (max-width: 600px) {
            .projects-grid {
                grid-template-columns: 1fr;
                padding: 1.5rem;
            }

            .title {
                font-size: 2rem;
            }
        }
    </style>
</head>

    <script>
        const observer = new IntersectionObserver((entries) => {
            entries.forEach(entry => {
                if (entry.isIntersecting) {
                    entry.target.classList.add('visible');
                }
            });
        }, { threshold: 0.2 });

        document.querySelectorAll('.details-container').forEach(el => observer.observe(el));
    </script>
